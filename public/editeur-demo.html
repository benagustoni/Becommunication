<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PF – Éditeur de démonstration</title><style>body{font:16px system-ui;background:#f1f5f9;color:#102943;margin:0}main{max-width:850px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0}input,textarea{box-sizing:border-box;width:100%;font:inherit;padding:10px}button{font:inherit;padding:12px;background:#102943;color:white;border:0;border-radius:6px;margin:5px}#preview{background:#102943;color:white;overflow-wrap:anywhere}#preview p{white-space:pre-wrap}</style><main><h1>PF Nettoyage – Éditeur</h1><p>Prototype : brouillon sur cet appareil uniquement. Aucune publication réelle.</p><section id="fields"></section><button id="save">Enregistrer le brouillon</button><button id="export">Exporter le brouillon</button><p role="status" id="status"></p><section id="preview"><h2>Aperçu</h2></section></main><script>const defaults={titre:"PF NETTOYAGE – FACILITY SERVICES",presentation:"Votre partenaire de confiance dans toute la Suisse romande.",horaires:"Interventions 7j/7 – Service d’urgence sur demande.",prestations:"Nettoyage, conciergerie, débarras, déménagement",promotion:"",bouton:"Demander un devis"};let data={...defaults};try{const saved=JSON.parse(localStorage.getItem("pf-editor-draft")||"{}");for(const k of Object.keys(defaults))if(typeof saved[k]==="string")data[k]=saved[k]}catch{}const fields=document.getElementById("fields"),preview=document.getElementById("preview"),status=document.getElementById("status");function render(){preview.replaceChildren();for(const k of Object.keys(defaults)){const el=document.createElement(k==="titre"?"h2":"p");el.textContent=data[k];preview.append(el)}}for(const k of Object.keys(defaults)){const label=document.createElement("label");label.textContent=k;const input=document.createElement("textarea");input.rows=2;input.maxLength=2000;input.value=data[k];input.addEventListener("input",()=>{data[k]=input.value;render()});label.append(input);fields.append(label)}render();document.getElementById("save").onclick=()=>{try{localStorage.setItem("pf-editor-draft",JSON.stringify(data));status.textContent="Brouillon enregistré sur cet appareil."}catch{status.textContent="Enregistrement impossible."}};document.getElementById("export").onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="pf-brouillon.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
