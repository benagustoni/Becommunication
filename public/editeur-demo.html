<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PF – Éditeur de démonstration</title><style>body{font:16px system-ui;background:#f1f5f9;color:#102943;margin:0}main{max-width:850px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0}input,textarea{box-sizing:border-box;width:100%;font:inherit;padding:10px}button{font:inherit;padding:12px;background:#102943;color:white;border:0;border-radius:6px;margin:5px}#preview{background:#102943;color:white;overflow-wrap:anywhere}#preview p{white-space:pre-wrap}</style><main><h1>PF Nettoyage – Éditeur</h1><p>Prototype : brouillon sur cet appareil uniquement. Aucune publication réelle.</p><section id="fields"></section><section><label>Photo de présentation (aperçu local, JPEG/PNG/WebP)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="removePhoto">Retirer la photo du brouillon</button></section><button id="save">Enregistrer le brouillon</button><button id="export">Exporter le brouillon</button><p role="status" id="status"></p><section id="preview"><h2>Aperçu</h2></section></main><script>const defaults={titre:"PF NETTOYAGE – FACILITY SERVICES",presentation:"Votre partenaire de confiance dans toute la Suisse romande.",horaires:"Interventions 7j/7 – Service d’urgence sur demande.",prestations:"Nettoyage, conciergerie, débarras, déménagement",promotion:"",bouton:"Demander un devis"};let data={...defaults};let photo="";try{const saved=JSON.parse(localStorage.getItem("pf-editor-draft")||"{}");for(const k of Object.keys(defaults))if(typeof saved[k]==="string")data[k]=saved[k]}catch{}const fields=document.getElementById("fields"),preview=document.getElementById("preview"),status=document.getElementById("status");function render(){preview.replaceChildren();for(const k of Object.keys(defaults)){const el=document.createElement(k==="titre"?"h2":"p");el.textContent=data[k];preview.append(el)}if(photo){const img=document.createElement("img");img.src=photo;img.alt="Photo de présentation";img.style.cssText="max-width:100%;height:auto;border-radius:8px";preview.append(img)}}for(const k of Object.keys(defaults)){const label=document.createElement("label");label.textContent=k;const input=document.createElement("textarea");input.rows=2;input.maxLength=2000;input.value=data[k];input.addEventListener("input",()=>{data[k]=input.value;render()});label.append(input);fields.append(label)}render();document.getElementById("photo").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!["image/jpeg","image/png","image/webp"].includes(f.type)||f.size>3000000){status.textContent="Image non acceptée (maximum 3 Mo).";return}const reader=new FileReader();reader.onload=()=>{photo=String(reader.result);render();status.textContent="Photo en aperçu uniquement, non enregistrée."};reader.readAsDataURL(f)};document.getElementById("removePhoto").onclick=()=>{photo="";document.getElementById("photo").value="";render()};document.getElementById("save").onclick=()=>{try{localStorage.setItem("pf-editor-draft",JSON.stringify(data));status.textContent="Brouillon enregistré sur cet appareil."}catch{status.textContent="Enregistrement impossible."}};document.getElementById("export").onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="pf-brouillon.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
