<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PF Nettoyage — Éditeur de site</title><style>body{font:16px system-ui;background:#eef3f8;color:#102440;margin:0}main{max-width:800px;margin:auto;padding:24px}section{background:white;padding:24px;border-radius:12px;margin:16px 0}label{display:block;margin:16px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #9aafc2;border-radius:6px}button{padding:12px 18px;background:#164779;color:white;border:0;border-radius:6px;font:inherit;margin:8px 8px 0 0}#preview{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h1>PF Nettoyage — Éditeur de site</h1><p>Prototype : brouillons locaux sur cet appareil uniquement. Aucune publication en ligne. Ne pas saisir de données confidentielles.</p><section><form id="editor"><label for="title">Titre d’accueil</label><input id="title" maxlength="150"><label for="intro">Présentation</label><textarea id="intro" rows="5" maxlength="3000"></textarea><label for="services">Prestations</label><textarea id="services" rows="7" maxlength="5000"></textarea><button type="submit">Enregistrer le brouillon local</button><button type="button" id="export">Exporter le brouillon</button><p id="status" role="status"></p></form></section><section><h2>Aperçu</h2><div id="preview"></div></section></main><script>'use strict';const fields=['title','intro','services'];const key='pf-site-editor-draft-v1';const el=id=>document.getElementById(id);const data=()=>Object.fromEntries(fields.map(k=>[k,el(k).value]));function preview(){el('preview').textContent=fields.map(k=>el(k).value).join('\n\n')}try{const d=JSON.parse(localStorage.getItem(key)||'{}');fields.forEach(k=>{if(typeof d[k]==='string')el(k).value=d[k]})}catch{}fields.forEach(k=>el(k).addEventListener('input',preview));preview();el('editor').addEventListener('submit',e=>{e.preventDefault();try{localStorage.setItem(key,JSON.stringify(data()));el('status').textContent='Brouillon enregistré sur cet appareil.'}catch{el('status').textContent='Enregistrement impossible. Exportez votre brouillon.'}});el('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='pf-site-brouillon.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});</script></html>
